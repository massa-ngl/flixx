          <form action="/search.html" class="search-form px-0 sm:px-30 md:px-45 lg:px-75">
            <div class="search-radio flex gap-8">
              <div class="movie-radio">
                <input type="radio" id="movie" name="type" value="movie" checked />
                <label for="movies">Movies</label>

              <div class="tv-radio">

                <label for="shows">TV Shows</label>

            <div class="search-flex mt-2.5 flex justify-between items-center gap-2">

              <button type="submit" class="btn inline-block px-4.5 py-3.25 sm:py-3.25 sm:px-9 cursor-pointer rounded-[5px] bg-[#f1c40f] text-black border hover:border-[#f1c40f] hover:bg-black hover:text-white transition-all duration-800 ease-in-out">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </form>
        </div>
