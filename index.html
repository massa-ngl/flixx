              <label for="movies">Movies</label>
            </div>
            <div class="tv-radio">

          </div>

            <button type="submit" class="btn inline-block px-4.5 py-3.25 sm:py-3.25 sm:px-9 cursor-pointer rounded-[5px] bg-[#f1c40f] text-black border hover:border-[#f1c40f] hover:bg-black hover:text-white transition-all duration-800 ease-in-out">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </form>
